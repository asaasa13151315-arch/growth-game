<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tier Studio</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--text:#17191d;--muted:#777d87;
  --line:#e2e5e9;--accent:#17191d;--shadow:0 8px 28px rgba(20,25,35,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
button,input{font:inherit}
button{border:0}
.app{min-height:100vh;max-width:900px;margin:auto;padding:18px 14px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.04em}
.actions{display:flex;gap:7px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-weight:700;font-size:13px;box-shadow:0 2px 7px rgba(0,0,0,.03);cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.workspace{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.tier{display:grid;grid-template-columns:72px 1fr;min-height:92px;border-bottom:1px solid var(--line)}
.tier:last-child{border-bottom:0}
.label{display:flex;align-items:center;justify-content:center;background:#eceef1;font-weight:900;font-size:22px;position:relative}
.label input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:900;font-size:22px;outline:none}
.items{display:flex;align-items:flex-start;align-content:flex-start;flex-wrap:wrap;gap:7px;padding:9px;min-height:92px}
.card{width:76px;height:76px;border-radius:9px;overflow:hidden;background:#f0f1f3;position:relative;touch-action:none;user-select:none;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card.selected{outline:3px solid #17191d;outline-offset:1px}
.card .x{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:22px;padding:0;display:none;cursor:pointer}
.card:hover .x,.card.selected .x{display:block}
.pool{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}
.pool-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.pool-title{font-weight:800;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
.pool-items{display:flex;flex-wrap:wrap;gap:7px;min-height:88px}
.empty{width:100%;display:flex;align-items:center;justify-content:center;color:#a1a6ae;font-size:13px;min-height:68px;border:1px dashed #d9dce1;border-radius:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.toolbar .btn{flex:1;min-width:130px}
input[type=file]{display:none}
.modal{position:fixed;inset:0;background:rgba(15,18,23,.4);display:none;align-items:flex-end;justify-content:center;padding:12px}
.modal.show{display:flex}
.sheet{background:var(--panel);width:min(560px,100%);border-radius:20px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.sheet h2{font-size:17px;margin:0 0 12px}
.field{display:flex;gap:8px;margin-bottom:10px}
.field input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px}
@media(min-width:650px){
  .app{padding-top:30px}
  .tier{grid-template-columns:90px 1fr}
  .card{width:86px;height:86px}
  .items,.pool-items{gap:9px}
}
@media(max-width:430px){
  .app{padding:12px 9px 22px}
  header{margin-bottom:12px}
  .brand{font-size:20px}
  .actions .btn{padding:8px 9px}
  .actions .secondary{display:none}
  .tier{grid-template-columns:58px 1fr;min-height:78px}
  .label,.label input{font-size:19px}
  .items{min-height:78px;padding:7px;gap:5px}
  .card{width:62px;height:62px;border-radius:7px}
  .pool{border-radius:15px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">Tier Studio</div>
  <div class="actions">
    <button class="btn secondary" id="undoBtn">↶ 戻す</button>
    <button class="btn" id="addTierBtn">＋ Tier</button>
    <button class="btn primary" id="addBtn">＋ 画像</button>
  </div>
</header>

<main id="workspace" class="workspace"></main>

<section class="pool">
  <div class="pool-head">
    <div class="pool-title">未配置</div>
    <div class="hint">タップ → 移動先をタップ</div>
  </div>
  <div id="poolItems" class="pool-items"></div>
</section>

<div class="toolbar">
  <button class="btn" id="resetBtn">配置をリセット</button>
  <button class="btn primary" id="exportBtn">画像として保存</button>
</div>

<input id="fileInput" type="file" accept="image/*" multiple>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>新しいTier</h2>
    <div class="field">
      <input id="newLabel" maxlength="8" placeholder="Tier名（例：S）">
      <button class="btn primary" id="createTier">追加</button>
    </div>
    <button class="btn" style="width:100%" id="closeModal">キャンセル</button>
  </div>
</div>

<script>
const state={tiers:[
 {id:1,label:"S",items:[]},{id:2,label:"A",items:[]},{id:3,label:"B",items:[]},
 {id:4,label:"C",items:[]},{id:5,label:"D",items:[]}
],pool:[],selected:null,nextId:10,history:[]};

const $=s=>document.querySelector(s);
const workspace=$("#workspace"), poolItems=$("#poolItems");
const fileInput=$("#fileInput");

function snapshot(){
  return JSON.stringify({tiers:state.tiers,pool:state.pool});
}
function saveHistory(){
  state.history.push(snapshot());
  if(state.history.length>30)state.history.shift();
}
function restoreSnapshot(s){
  const x=JSON.parse(s); state.tiers=x.tiers; state.pool=x.pool; state.selected=null; render();
}
function render(){
  workspace.innerHTML="";
  state.tiers.forEach(t=>{
    const row=document.createElement("div"); row.className="tier"; row.dataset.tier=t.id;
    const label=document.createElement("div"); label.className="label";
    const input=document.createElement("input"); input.value=t.label; input.maxLength=8;
    input.addEventListener("change",()=>{saveHistory();t.label=input.value||"Tier";});
    label.append(input); row.append(label);
    const items=document.createElement("div"); items.className="items"; items.dataset.container="tier";
    items.dataset.id=t.id; fillItems(items,t.items); row.append(items); workspace.append(row);
  });
  poolItems.innerHTML="";
  if(!state.pool.length){
    const e=document.createElement("div");e.className="empty";e.textContent="画像を追加するとここに表示されます";poolItems.append(e);
  } else fillItems(poolItems,state.pool);
}
function fillItems(parent,items){
  items.forEach(item=>{
    const c=document.createElement("div");c.className="card"+(state.selected===item.id?" selected":"");
    c.dataset.item=item.id;
    const img=document.createElement("img");img.src=item.src; c.append(img);
    const x=document.createElement("button");x.className="x";x.textContent="×";
    x.onclick=e=>{e.stopPropagation();saveHistory();removeItem(item.id);};
    c.append(x);
    c.onclick=()=>handleTap(item.id);
    parent.append(c);
  });
}
function removeItem(id){
  for(const t of state.tiers){
    const idx=t.items.findIndex(x=>x.id===id);
    if(idx!==-1){t.items.splice(idx,1);if(state.selected===id)state.selected=null;render();return;}
  }
  const idx=state.pool.findIndex(x=>x.id===id);
  if(idx!==-1){state.pool.splice(idx,1);if(state.selected===id)state.selected=null;render();}
}
function findContainerOf(id){
  for(const t of state.tiers){
    if(t.items.some(x=>x.id===id))return t.items;
  }
  if(state.pool.some(x=>x.id===id))return state.pool;
  return null;
}
function moveItemTo(itemId,targetItems,targetIndex=-1){
  let item=null;
  for(const t of state.tiers){
    const idx=t.items.findIndex(x=>x.id===itemId);
    if(idx!==-1){item=t.items.splice(idx,1)[0];break;}
  }
  if(!item){
    const idx=state.pool.findIndex(x=>x.id===itemId);
    if(idx!==-1){item=state.pool.splice(idx,1)[0];}
  }
  if(!item)return;
  if(targetIndex>=0&&targetIndex<targetItems.length){
    targetItems.splice(targetIndex,0,item);
  }else{
    targetItems.push(item);
  }
}
function handleTap(id){
  if(state.selected===null){state.selected=id;render();return}
  if(state.selected===id){state.selected=null;render();return}
  
  saveHistory();
  const targetContainer=findContainerOf(id);
  const targetIndex=targetContainer.findIndex(x=>x.id===id);
  moveItemTo(state.selected,targetContainer,targetIndex);
  state.selected=null;render();
}
function moveToContainer(containerItems){
  if(state.selected===null)return;
  saveHistory();
  moveItemTo(state.selected,containerItems);
  state.selected=null;render();
}
workspace.addEventListener("click",e=>{
  const items=e.target.closest(".items");
  if(items && !e.target.closest(".card")){
    const id=Number(items.dataset.id);
    const t=state.tiers.find(x=>x.id===id);
    if(t)moveToContainer(t.items);
  }
});
poolItems.addEventListener("click",e=>{
  if(!e.target.closest(".card"))moveToContainer(state.pool);
});
$("#addBtn").onclick=()=>fileInput.click();
fileInput.onchange=e=>{
  const files=[...e.target.files];
  if(!files.length)return;
  saveHistory();
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{state.pool.push({id:state.nextId++,src:ev.target.result});render();};
    r.readAsDataURL(f);
  });
  fileInput.value="";
};
$("#undoBtn").onclick=()=>{
  if(!state.history.length)return;
  restoreSnapshot(state.history.pop());
};
$("#resetBtn").onclick=()=>{
  saveHistory();
  state.tiers.forEach(t=>{state.pool.push(...t.items);t.items=[]});
  state.selected=null;
  render();
};
const modal=$("#modal");
$("#addTierBtn").onclick=()=>{modal.classList.add("show");$("#newLabel").focus()};
$("#closeModal").onclick=()=>modal.classList.remove("show");
$("#createTier").onclick=()=>{
  const v=$("#newLabel").value.trim()||"Tier";
  saveHistory();state.tiers.push({id:state.nextId++,label:v,items:[]});
  $("#newLabel").value="";modal.classList.remove("show");render();
};
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")};

async function exportImage(){
  const scale=2, w=Math.min(1000,Math.max(650,workspace.clientWidth));
  const rowH=92, labelW=90, pad=14, card=86, gap=9;
  const h=state.tiers.length*rowH+pad*2;
  const canvas=document.createElement("canvas");canvas.width=w*scale;canvas.height=h*scale;
  const ctx=canvas.getContext("2d");ctx.scale(scale,scale);
  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,w,h);
  ctx.font="800 22px -apple-system,BlinkMacSystemFont,sans-serif";
  for(let i=0;i<state.tiers.length;i++){
    const t=state.tiers[i], y=pad+i*rowH;
    ctx.fillStyle="#eceef1";ctx.fillRect(0,y,labelW,rowH);
    ctx.fillStyle="#17191d";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(t.label,labelW/2,y+rowH/2);
    for(let j=0;j<t.items.length;j++){
      const x=labelW+pad+j*(card+gap);
      const img=new Image();img.src=t.items[j].src;
      await new Promise(r=>{img.onload=r;img.onerror=r});
      ctx.save();ctx.beginPath();ctx.roundRect(x,y+3,card,card,9);ctx.clip();
      ctx.drawImage(img,x,y+3,card,card);ctx.restore();
    }
    ctx.strokeStyle="#e2e5e9";ctx.beginPath();ctx.moveTo(0,y+rowH-.5);ctx.lineTo(w,y+rowH-.5);ctx.stroke();
  }
  const a=document.createElement("a");a.download="tier-list.png";a.href=canvas.toDataURL("image/png");a.click();
}
$("#exportBtn").onclick=exportImage;
render();
</script>
</body>
</html>
